  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(o) {
  if (!audioCtx || muted) return;
  const freq = o.freq || 440, dur = o.dur || 0.1, type = o.type || 'sine';
  const vol = o.vol !== undefined ? o.vol : 0.12, now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, now);
  if (o.slideTo !== undefined) { try { osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slideTo), now + dur); } catch (e) {} }
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vol, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + dur + 0.03);
}
function playNoise(o) {
  if (!audioCtx || muted) return;
  const dur = o.dur || 0.1, vol = o.vol !== undefined ? o.vol : 0.1, now = audioCtx.currentTime;
  const bufSize = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource(); src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = o.filterType || 'lowpass'; filter.frequency.value = o.filterFreq || 2000;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, now); gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start(now); src.stop(now + dur + 0.03);
}

let seed = 1337;
function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function hash(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; }

function isSolidTile(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= activeW || ty >= activeH) return true;
  const t = activeMap[ty][tx];
  return t === 2 || t === 3 || t === 5 || t === 7 || t === 9 || t === 12 || t === 13 || t === 14 || t === 15 || t === 16 || t === 18 || t === 19;
}
function projectileCollides(x, y, r) {
  const minx = Math.floor((x - r) / TILE), maxx = Math.floor((x + r) / TILE);
  const miny = Math.floor((y - r) / TILE), maxy = Math.floor((y + r) / TILE);
  for (let ty = miny; ty <= maxy; ty++)
    for (let tx = minx; tx <= maxx; tx++) {
      if (!isSolidTile(tx, ty)) continue;
      const cx = Math.max(tx * TILE, Math.min(x, (tx + 1) * TILE));
      const cy = Math.max(ty * TILE, Math.min(y, (ty + 1) * TILE));
      const dx = x - cx, dy = y - cy;
      if (dx * dx + dy * dy < r * r) return true;
    }
  return false;
}
function circleCollides(x, y, r) { return projectileCollides(x, y, r); }
function moveEntity(e, dx, dy) {
  if (!circleCollides(e.x + dx, e.y, e.r)) e.x += dx;
  if (!circleCollides(e.x, e.y + dy, e.r)) e.y += dy;
}
function isInWater(x, y) {
  const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
  if (tx < 0 || ty < 0 || tx >= activeW || ty >= activeH) return false;
  return activeMap[ty][tx] === 4;
}
function isInVillage(x, y) {
  for (const v of villages) if (Math.hypot(x - v.x, v.y - y) < 6 * TILE) return true;
  return false;
}

const MM_RES = 400, MM_MARGIN = 12;
let minimapTerrain = null;
function buildMinimapTerrain() {
  if (!minimapTerrain) { minimapTerrain = document.createElement('canvas'); minimapTerrain.width = MM_RES; minimapTerrain.height = MM_RES; }
  const c = minimapTerrain.getContext('2d');
  c.clearRect(0, 0, MM_RES, MM_RES);
  const px = MM_RES / WORLD_W, th = THEMES[currentLocationId];
  for (let y = 0; y < WORLD_H; y++)
    for (let x = 0; x < WORLD_W; x++) {
      const t = map[y][x];
      let color;
      if (t === 0) color = `rgb(${th.grass[0]},${th.grass[1]},${th.grass[2]})`;
      else if (t === 1) color = '#6a5230'; else if (t === 10) color = '#888078';
      else if (t === 2) color = `rgb(${th.treeTop[0]},${th.treeTop[1]},${th.treeTop[2]})`;
      else if (t === 3) color = '#585850'; else if (t === 4) color = th.water;
      else if (t === 5) color = '#8a4a2a'; else if (t === 11) color = '#1a0a0a';
      else if (t === 13) color = '#4a90d0'; else if (t === 14) color = '#7a5a3a';
      else if (t === 15) color = '#c8a040';
      c.fillStyle = color;
      c.fillRect(x * px, y * px, px + 0.6, px + 0.6);
    }
  for (const v of villages) {
    const vx = (v.tcx / WORLD_W) * MM_RES, vy = (v.tcy / WORLD_H) * MM_RES;
    c.fillStyle = 'rgba(240, 210, 130, 0.85)';
    c.beginPath(); c.arc(vx, vy, 6, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(120, 80, 30, 0.9)'; c.lineWidth = 1.5; c.stroke();
  }
  for (const cv of caves) {
    c.fillStyle = cv.isFinal ? '#ff40ff' : '#5a2a5a';
    c.beginPath(); c.arc((cv.tcx / WORLD_W) * MM_RES, (cv.tcy / WORLD_H) * MM_RES, cv.isFinal ? 6 : 4, 0, Math.PI * 2); c.fill();
  }
}

      map[ty][tx] = 1;
    }
}
function graphDistance(a, b) {
  if (a === b) return 0;
  const adj = { 0: [1,2,3,4], 1: [0], 2: [0], 3: [0], 4: [0] };
  const q = [[a, 0]], visited = new Set([a]);
  while (q.length) {
    const [cur, d] = q.shift();
    for (const next of (adj[cur] || [])) {
      if (next === b) return d + 1;
      if (!visited.has(next)) { visited.add(next); q.push([next, d + 1]); }
    }
  }
  return 99;
}

function genMap(locInfo) {
  map = [];
  for (let y = 0; y < WORLD_H; y++) { map[y] = []; for (let x = 0; x < WORLD_W; x++) map[y][x] = 0; }
  const isLoc1 = locInfo.id === 1, isLoc2 = locInfo.id === 2, isLoc3 = locInfo.id === 3, isLoc4 = locInfo.id === 4;
  const treeCount = isLoc2 ? 180 : (isLoc1 || isLoc4 ? 30 : 140);
  for (let i = 0; i < treeCount; i++) {
    const cx = rand() * WORLD_W, cy = rand() * WORLD_H, r = 1.8 + rand() * 3.5;
    for (let y = Math.floor(cy - r); y <= cy + r; y++)
      for (let x = Math.floor(cx - r); x <= cx + r; x++) {
        if (x < 1 || y < 1 || x >= WORLD_W - 1 || y >= WORLD_H - 1) continue;
        if (Math.hypot(x - cx, y - cy) < r && rand() < 0.42) map[y][x] = 2;
      }
  }
  const rockCount = isLoc3 ? 160 : 90;
  for (let i = 0; i < rockCount; i++) {
    const cx = Math.floor(rand() * WORLD_W), cy = Math.floor(rand() * WORLD_H), r = 0.7 + rand() * 1.5;
    for (let y = Math.floor(cy - r); y <= cy + r; y++)
      for (let x = Math.floor(cx - r); x <= cx + r; x++) {
        if (x < 1 || y < 1 || x >= WORLD_W - 1 || y >= WORLD_H - 1) continue;
        if (Math.hypot(x - cx, y - cy) < r && rand() < 0.55) map[y][x] = 3;
      }
  }
  const lakeCount = isLoc4 ? 4 : (isLoc1 ? 8 : 24);
  for (let i = 0; i < lakeCount; i++) {
    const cx = rand() * WORLD_W, cy = rand() * WORLD_H, r = 2.5 + rand() * 4;
    for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++)
      for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) {
        if (x < 1 || y < 1 || x >= WORLD_W - 1 || y >= WORLD_H - 1) continue;
        const d = Math.hypot(x - cx, y - cy);
        if (d < r) map[y][x] = 4;
        else if (d < r + 1 && map[y][x] === 0) map[y][x] = 1;
      }
  }
  const mx = Math.floor(WORLD_W / 2), my = Math.floor(WORLD_H / 2);
  for (let y = my - 7; y <= my + 7; y++)
    for (let x = mx - 7; x <= mx + 7; x++)
      if (x >= 0 && y >= 0 && x < WORLD_W && y < WORLD_H) map[y][x] = Math.hypot(x - mx, y - my) < 6 ? 1 : 0;
  for (let x = 0; x < WORLD_W; x++) { map[0][x] = 2; map[WORLD_H - 1][x] = 2; }
  for (let y = 0; y < WORLD_H; y++) { map[y][0] = 2; map[y][WORLD_W - 1] = 2; }
}

function genVillages() {
  villages = [];
  const target = currentLocationId === 0 ? 4 : 2;
  for (let attempt = 0; attempt < 500 && villages.length < target; attempt++) {
    const vcx = 18 + Math.floor(rand() * (WORLD_W - 36)), vcy = 18 + Math.floor(rand() * (WORLD_H - 36));
    const sx = Math.floor(WORLD_W / 2), sy = Math.floor(WORLD_H / 2);
    if (Math.hypot(vcx - sx, vcy - sy) < 20) continue;
    let tooClose = false;
    for (const v of villages) if (Math.hypot(vcx - v.tcx, vcy - v.tcy) < 32) { tooClose = true; break; }
    if (tooClose) continue;
    let clear = true;
    for (let y = -9; y <= 9 && clear; y++)
      for (let x = -9; x <= 9 && clear; x++) {
        const tx = vcx + x, ty = vcy + y;
        if (tx < 3 || ty < 3 || tx >= WORLD_W - 3 || ty >= WORLD_H - 3) { clear = false; break; }
        if (x * x + y * y > 81) continue;
        if (map[ty][tx] === 4) clear = false;
      }
    if (!clear) continue;
    const village = { tcx: vcx, tcy: vcy, x: vcx * TILE + TILE / 2, y: vcy * TILE + TILE / 2, houses: [], npcs: [], torches: [] };
    for (let y = -8; y <= 8; y++)
      for (let x = -8; x <= 8; x++) {
        if (x * x + y * y > 60) continue;
        map[vcy + y][vcx + x] = 1;
      }
    map[vcy][vcx] = 13;
    map[vcy - 1][vcx - 3] = 15; map[vcy - 1][vcx + 3] = 15;
    for (let ang = 0; ang < 32; ang++) {
      const a = ang * Math.PI / 16;
      const dx = Math.round(Math.cos(a) * 8), dy = Math.round(Math.sin(a) * 8);
      const tx = vcx + dx, ty = vcy + dy;
      if (tx < 2 || ty < 2 || tx >= WORLD_W - 2 || ty >= WORLD_H - 2) continue;
      if (Math.abs(dx) <= 1 || Math.abs(dy) <= 1) continue;
      if (map[ty][tx] === 1) map[ty][tx] = 14;
    }
    const houseOffsets = [{ hx: -6, hy: -6 }, { hx: 3, hy: -6 }, { hx: -6, hy: 3 }, { hx: 3, hy: 3 }, { hx: -2, hy: -7 }, { hx: -2, hy: 4 }];
    for (const h of houseOffsets) {
      const htx = vcx + h.hx, hty = vcy + h.hy;
      let ok = true;
      for (let dy = 0; dy < 2; dy++)
        for (let dx = 0; dx < 2; dx++) {
          const tx = htx + dx, ty = hty + dy;
          if (map[ty][tx] === 13 || map[ty][tx] === 14 || map[ty][tx] === 15 || map[ty][tx] === 5) ok = false;
        }
      if (!ok) continue;
      for (let dy = 0; dy < 2; dy++)
        for (let dx = 0; dx < 2; dx++) map[hty + dy][htx + dx] = 5;
      village.houses.push({ tx: htx, ty: hty, doorX: (htx + 1) * TILE, doorY: (hty + 2) * TILE + TILE / 2, interior: null });
    }
    const torchPositions = [{ x: -5, y: -5 }, { x: 5, y: -5 }, { x: -5, y: 5 }, { x: 5, y: 5 }];
    for (const tp of torchPositions) {
      const tx = vcx + tp.x, ty = vcy + tp.y;
      if (map[ty][tx] === 0 || map[ty][tx] === 1) village.torches.push({ x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2 });
    }
    const npcCount = 3 + Math.floor(rand() * 2);
    const usedRace = new Set();
    const npcSpots = [{ x: -2, y: 2 }, { x: 2, y: 2 }, { x: 0, y: -2 }, { x: -3, y: 0 }, { x: 3, y: 0 }];
    let merchantAssigned = false;
    for (let i = 0; i < npcCount && i < npcSpots.length; i++) {
      let race, attempts = 0;
      do { race = NPC_RACES[Math.floor(rand() * NPC_RACES.length)]; attempts++; }
      while (usedRace.has(race.name) && attempts < 12);
      usedRace.add(race.name);
      let role;
      if (!merchantAssigned && (i === npcCount - 1 || rand() < 0.6)) { role = 'merchant'; merchantAssigned = true; }
      else {
        const avail = race.roles.filter(r => r !== 'merchant' || !merchantAssigned);
        role = avail.length ? avail[Math.floor(rand() * avail.length)] : 'merchant';
        if (role === 'merchant') merchantAssigned = true;
      }
      const spot = npcSpots[i];
      village.npcs.push({
        x: (vcx + spot.x) * TILE + TILE / 2, y: (vcy + spot.y) * TILE + TILE / 2,
        r: 13, name: ROLE_NAMES[role], race: race.name, role,
        color: race.color, skin: race.skin, bob: rand() * Math.PI * 2,
        quest: role === 'merchant' ? null : generateQuest(role)
      });
    }
    if (!merchantAssigned && village.npcs.length > 0) {
      village.npcs[0].role = 'merchant';
      village.npcs[0].name = ROLE_NAMES.merchant;
      village.npcs[0].quest = null;
    }
    villages.push(village);
  }
  const sx = Math.floor(WORLD_W / 2), sy = Math.floor(WORLD_H / 2);
  for (let i = 0; i < villages.length; i++) carveLPath(sx, sy, villages[i].tcx, villages[i].tcy, i % 2 === 1);
}
function carveLPath(x1, y1, x2, y2, isStone) {
  const tileType = isStone ? 10 : 1;
  const hFirst = rand() < 0.5;
  const carveTile = (tx, ty) => {
    if (tx < 1 || ty < 1 || tx >= WORLD_W - 1 || ty >= WORLD_H - 1) return;
    if (map[ty][tx] === 5 || map[ty][tx] === 13 || map[ty][tx] === 15) return;
    map[ty][tx] = tileType;
  };
  const carveH = (xa, xb, y) => { for (let x = Math.min(xa, xb); x <= Math.max(xa, xb); x++) { carveTile(x, y); carveTile(x, y - 1); carveTile(x, y + 1); } };
  const carveV = (ya, yb, x) => { for (let y = Math.min(ya, yb); y <= Math.max(ya, yb); y++) { carveTile(x, y); carveTile(x - 1, y); carveTile(x + 1, y); } };
  if (hFirst) { carveH(x1, x2, y1); carveV(y1, y2, x2); } else { carveV(y1, y2, x1); carveH(x1, x2, y2); }
}

function genCaves() {
  caves = [];
  const target = 2 + Math.floor(rand() * 2);
  for (let attempt = 0; attempt < 200 && caves.length < target; attempt++) {
    const ccx = 18 + Math.floor(rand() * (WORLD_W - 36)), ccy = 18 + Math.floor(rand() * (WORLD_H - 36));
    const sx = Math.floor(WORLD_W / 2), sy = Math.floor(WORLD_H / 2);
    if (Math.hypot(ccx - sx, ccy - sy) < 20) continue;
    let tooClose = false;
    for (const v of villages) if (Math.hypot(ccx - v.tcx, ccy - v.tcy) < 15) { tooClose = true; break; }
    if (tooClose) continue;
    for (const c of caves) if (Math.hypot(ccx - c.tcx, ccy - c.tcy) < 20) { tooClose = true; break; }
    if (tooClose) continue;
    let ok = true;
    for (let y = -3; y <= 3 && ok; y++)
      for (let x = -3; x <= 3 && ok; x++)
        if (map[ccy + y] && map[ccy + y][ccx + x] === 4) ok = false;
    if (!ok) continue;
    for (let y = -2; y <= 2; y++)
      for (let x = -2; x <= 2; x++) { if (x * x + y * y > 6) continue; map[ccy + y][ccx + x] = 1; }
    map[ccy][ccx] = 11;
    caves.push({ tcx: ccx, tcy: ccy, x: ccx * TILE + TILE / 2, y: ccy * TILE + TILE / 2,
      doorX: ccx * TILE + TILE / 2, doorY: ccy * TILE + TILE / 2,
      interior: null, cleared: false, pendingLoot: null, isFinal: false });
  }
}

function generateCaveInterior() {
  const cw = 25, ch = 22, cmap = [];
  for (let y = 0; y < ch; y++) {
    cmap[y] = [];
    for (let x = 0; x < cw; x++) {
      if (x === 0 || y === 0 || x === cw - 1 || y === ch - 1) cmap[y][x] = 12;
      else cmap[y][x] = hash(x + currentLocationId * 100, y + currentLocationId * 50) < 0.12 ? 12 : 0;
    }
  }
  for (let y = 2; y <= 6; y++)
    for (let x = Math.floor(cw / 2) - 3; x <= Math.floor(cw / 2) + 3; x++)
      if (x > 0 && x < cw - 1 && y > 0 && y < ch - 1) cmap[y][x] = 0;
  const doorX = Math.floor(cw / 2);
  for (let y = ch - 5; y < ch; y++)
    for (let x = doorX - 3; x <= doorX + 3; x++) if (x > 0 && x < cw - 1) cmap[y][x] = 0;
  cmap[ch - 1][doorX] = 11;
  const chest = { x: (cw / 2) * TILE, y: 9 * TILE, collected: false };

function handleInventoryAction(action) {

    if (player.potions <= 0) return;
    if (player.hp >= player.maxHp) { addNotification('HP полное', '#a89060'); return; }
    player.potions--;
    const heal = Math.round(player.maxHp * 0.5);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    addNotification('+' + heal + ' HP', '#6bff8f'); SFX.pickup(); return;
  }
  if (action.type === 'use_potion_mana') {
    if (player.manaPotions <= 0) return;
    if (player.resourceType === 'mana' && player.mana >= player.maxMana) { addNotification('Мана полная', '#a89060'); return; }
    if (player.resourceType === 'stamina' && player.stamina >= player.maxStamina) { addNotification('Выносливость полная', '#a89060'); return; }
    player.manaPotions--;
    if (player.resourceType === 'mana') player.mana = Math.min(player.maxMana, player.mana + 50);

    addNotification('+50 ресурса', '#80c0ff'); SFX.pickup(); return;
  }
  const canSell = !!(nearbyNPC && nearbyNPC.role === 'merchant');
  if (!canSell) { addNotification('Подойдите к торговцу', '#ff8080'); return; }
  if (action.type === 'weapon') {
    const idx = player.weaponsBought.indexOf(action.id);
    if (idx < 0) return;
    player.weaponsBought.splice(idx, 1); recalcWeaponDmg(); player.gold += action.price;
    addNotification('Продано: ' + action.name, '#7ef0a0'); SFX.sell();
  } else if (action.type === 'armor') {
    const idx = player.armorBought.indexOf(action.id);
    if (idx < 0) return;
    player.armorBought.splice(idx, 1); recalcArmor(); player.gold += action.price;
    addNotification('Продано: ' + action.name, '#7ef0a0'); SFX.sell();
  } else if (action.type === 'material') {
    player.materials[action.matId] = 0; player.gold += action.price;
    addNotification('Продано: +' + action.price + '💰', '#7ef0a0'); SFX.sell();
  }
}

function genRoomCode() {
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)];
  return s;
}
function getWsUrl(roomId) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}/?room=${encodeURIComponent(roomId)}`;
}
function startHosting() {
  stopOnline();
  roomCode = genRoomCode();
  isHost = true;
  connectWs(roomCode);
}
function startJoining(code) {
  stopOnline();
  roomCode = code.trim().toUpperCase();
  isHost = false;
  connectWs(roomCode);
}
function connectWs(code) {
  onlineStatus = 'Подключение...';
  try { ws = new WebSocket(getWsUrl(code)); }
  catch (e) { onlineStatus = 'Ошибка: ' + e.message; return; }
  ws.onopen = () => {
    isOnline = true;
    onlineStatus = 'Комната: ' + code;
    addNotification('🌐 Онлайн: ' + code, '#7ef0a0');
    netTimers.forEach(t => clearInterval(t));
    netTimers = [
      setInterval(() => {
        if (!isOnline || !ws || ws.readyState !== 1 || gameState !== 'playing') return;
        if (!isHost && player) ws.send(JSON.stringify({ t: 'state', state: getMyState() }));
      }, 66),
      setInterval(() => {
        if (!isOnline || !isHost || !ws || ws.readyState !== 1 || gameState !== 'playing' || subLocation) return;
        const list = enemies.filter(e => e._netId !== undefined).map(e => ({
          id: e._netId, type: e.type, x: Math.round(e.x), y: Math.round(e.y),
          angle: Math.round(e.angle * 100) / 100, hp: Math.round(e.hp), maxHp: e.maxHp,
          isBoss: !!e.isBoss, isAnimal: !!e.isAnimal, friendly: !!e.friendly,
          color: e.color, dark: e.dark, r: e.r
        }));
        ws.send(JSON.stringify({ t: 'enemies', list }));
      }, 100),
      setInterval(() => {
        if (!isOnline || !isHost || !ws || ws.readyState !== 1 || gameState !== 'playing' || !player) return;
        const list = [{ id: myId, name: player.className || 'Хост', state: getMyState() }];
        for (const [pid, rp] of remotePlayers) if (rp.state) list.push({ id: pid, name: rp.name || 'Игрок', state: rp.state });
        ws.send(JSON.stringify({ t: 'players', players: list }));
      }, 100)
    ];
  };
  ws.onmessage = (ev) => { try { handleNetMessage(JSON.parse(ev.data)); } catch (e) { console.error('Net:', e); } };
  ws.onclose = () => {
    const wasOnline = isOnline;
    isOnline = false;
    netTimers.forEach(t => clearInterval(t));
    netTimers = [];
    remotePlayers.clear();
    onlineStatus = 'Отключено';
    if (wasOnline) addNotification('⚠ Соединение потеряно', '#ff8080');
  };
}
function stopOnline() {
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
  netTimers.forEach(t => clearInterval(t));
  netTimers = [];
  remotePlayers.clear();
  isOnline = false; isHost = false; roomCode = null; onlineStatus = ''; myId = null;
}
function getMyState() {
  if (!player) return null;
  return {
    x: Math.round(player.x), y: Math.round(player.y),
    angle: Math.round(player.angle * 100) / 100,
    hp: Math.round(player.hp), maxHp: player.maxHp,

function handleNetMessage(msg) {
  if (msg.t === 'welcome') {
    myId = msg.id;
    if (onlineDialog && onlineDialog.tab === 'join' && msg.isHost) {
      addNotification('Комната не найдена: ' + roomCode, '#ff8080');
      onlineStatus = 'Комната не найдена';
      stopOnline();
      return;
    }
    isOnline = true; isHost = msg.isHost;
    remotePlayers.clear();
    if (msg.players) for (const pid of msg.players) remotePlayers.set(pid, { name: 'Игрок', state: null });
    onlineStatus = (isHost ? '👑 Хост' : 'Гость') + ' • ' + roomCode;
    addNotification(`🌐 ${isHost ? 'Хост' : 'Гость'} комнаты ${roomCode}`, '#7ef0a0');
  } else if (msg.t === 'join') {
    if (!remotePlayers.has(msg.id)) {
      remotePlayers.set(msg.id, { name: 'Игрок', state: null });
      addNotification('+ игрок подключился', '#c8e8ff');
    }
  } else if (msg.t === 'leave') {
    remotePlayers.delete(msg.id);
  } else if (msg.t === 'becomeHost') {
    isHost = true; nextNetEnemyId = 1;
    for (const e of enemies) e._netId = nextNetEnemyId++;
    addNotification('★ Ты стал хостом ★', '#ffd700');
  } else if (msg.t === 'state') {
    let rp = remotePlayers.get(msg.from) || { name: 'Игрок' };
    rp.state = msg.state;
    remotePlayers.set(msg.from, rp);
  } else if (msg.t === 'players') {
    const seen = new Set();
    for (const p of msg.players) {
      if (myId !== null && p.id === myId) continue;
      seen.add(p.id);
      let rp = remotePlayers.get(p.id) || { name: 'Игрок' };
      rp.name = p.name || rp.name;
      rp.state = p.state;
      remotePlayers.set(p.id, rp);
    }
    for (const pid of [...remotePlayers.keys()]) if (!seen.has(pid)) remotePlayers.delete(pid);
  } else if (msg.t === 'enemies') {
    if (!isHost) applyEnemySnapshot(msg.list);
  } else if (msg.t === 'hit') {
    if (!isHost) return;
    const e = enemies.find(x => x._netId === msg.id);
    if (e) { e._lastHitBy = msg.from; damageEnemy(e, msg.dmg, msg.kx || 0, msg.ky || 0); e._lastHitBy = null; }
  } else if (msg.t === 'hurt') {
    hurtPlayer(msg.dmg);
  } else if (msg.t === 'killReward') {
    gainXp(msg.xp || 0);
    if (msg.drops) for (const k in msg.drops)
      player.materials[k] = (player.materials[k] || 0) + Math.ceil(msg.drops[k] * (player.classId === 'hunter' ? 1.5 : 1));
  } else if (msg.t === 'gameStarted') {
    onlineDialog = null;
    resetGame();
    addNotification('🌐 Игра началась!', '#7ef0a0');
  }
}
function applyEnemySnapshot(list) {
  if (subLocation) return;
  const incoming = new Set(list.map(e => e.id));
  for (const s of list) {
    let local = enemies.find(x => x._netId === s.id);
    if (local) {
      local.x += (s.x - local.x) * 0.5;
      local.y += (s.y - local.y) * 0.5;
      local.angle = s.angle; local.hp = s.hp; local.maxHp = s.maxHp;
    } else {
      enemies.push({
        ...s, _netId: s.id, _fromNet: true,
        speed: 100, dmg: 10, atkRate: 1, aggro: 400, xp: 10, level: 1,

function gainXp(n) {

  while (player.xp >= player.xpNext && player.level < MAX_LEVEL) {
    player.xp -= player.xpNext; player.level++;
    if (player.level >= MAX_LEVEL) {
      player.level = MAX_LEVEL; player.xp = 0; player.xpNext = 1;
      addFloat(player.x, player.y - 45, 'МАКС. УРОВЕНЬ 60!', '#ffd700');

function handlePauseClick(x, y) {

  if (x >= bx && x <= bx + btnW && y >= by && y <= by + btnH) { gameState = 'playing'; SFX.uiClick(); return; }
  by += btnH + gap;
  if (x >= bx && x <= bx + btnW && y >= by && y <= by + btnH) {
    if (saveGame()) { pauseMessage = 'Игра сохранена ✓'; pauseMessageTimer = 2.5; SFX.coin(); }
    else { pauseMessage = 'Ошибка сохранения'; pauseMessageTimer = 2.5; }
    return;

    if (e.code === 'Space') { e.preventDefault(); swordAttack(); }

    console.error('Ошибка цикла:', e);
    ctx.fillStyle = '#2a0a0a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff8080'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'left';
    ctx.fillText('⚠ ' + (e.message || 'Ошибка'), 20, 40);
  }
  requestAnimationFrame(loop);
}
function render() {
  if (gameState === 'menu') { drawMenu(); if (onlineDialog) drawOnlineDialog(); return; }
  ctx.fillStyle = '#12160f'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  const sx = (rand() - 0.5) * camera.shake, sy = (rand() - 0.5) * camera.shake;
  ctx.translate(sx, sy);
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-camera.x, -camera.y);
  drawTiles();
  drawHouses();
  drawTorches();
  drawCaveEntrances();
  drawPickups();
  const drawables = [];
  if (!subLocation) {
    const cp = getCartPos();
    drawables.push({ y: cp.y - 20, draw: () => drawCartHorse(cp.x, cp.y) });
    for (const v of villages) for (const npc of v.npcs) drawables.push({ y: npc.y, draw: () => drawNPC(npc) });
  } else {
    if (subLocation.npc) drawables.push({ y: subLocation.npc.y, draw: () => drawNPC(subLocation.npc) });
    if (subLocation.chest && !subLocation.chest.collected) {
      const c = subLocation.chest;
      drawables.push({ y: c.y, draw: () => drawChest(c) });
    }
  }
  for (const [pid, rp] of remotePlayers) {
    if (rp.state && !rp.state.inSub && rp.state.locId === currentLocationId)
      drawables.push({ y: rp.state.y, draw: () => drawRemotePlayer(rp) });
  }
  for (const e of enemies) drawables.push({ y: e.y, draw: () => drawEnemy(e) });
  drawables.push({ y: player.y, draw: drawPlayer });
  if (player.pet) drawables.push({ y: player.pet.y, draw: drawPet });
  drawables.sort((a, b) => a.y - b.y);
  for (const d of drawables) d.draw();
  drawProjectiles();
  drawParticles();
  drawFloats();
  ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (player.hitFlash > 0) { ctx.fillStyle = 'rgba(200,30,30,' + (player.hitFlash * 0.5) + ')'; ctx.fillRect(0, 0, W, H); }
  drawQuestIndicators();
  if (!dialog && !shop && !inventoryOpen && !cartMenu && !cartDialogue) { drawNPCHint(); drawAnimalHint(); drawCartHint(); drawHouseHint(); drawCaveHint(); drawCaveExitHint(); }
  drawNotifications();
  drawHUD();
  if (!subLocation) drawMinimap();
  drawPauseButton();
  drawInventoryButton();
  drawControls();
  if (inventoryOpen) drawInventory();
  if (cartDialogue) drawCartDialogueOverlay();
  if (cartMenu) drawCartMenu();
  if (dialog) drawDialog();
  if (shop) drawShop();
  if (onlineDialog) drawOnlineDialog();
  if (gameState === 'paused') drawPauseMenu();
  if (gameState === 'dead') drawDeathScreen();
}

resize();
checkSaveExists();
(function autoJoin() {
  const params = new URLSearchParams(location.search);
  const r = params.get('room');
  if (r && r.length === 6) {
    onlineDialog = { tab: 'join', code: r.toUpperCase(), buttons: null };
    startJoining(onlineDialog.code);
  }
})();
requestAnimationFrame(loop);
</script>
</body>
</html>
